<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical AI Assistant — Diagnosis</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Disease Diagnosis Assistant</h1>
      <p class="subtitle">Educational demo — not a substitute for professional medical advice.</p>
    </header>

    <form id="diagnosis-form">
      <div class="field-row">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="0" max="120" required />
      </div>

      <div class="field-row">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select…</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field-row">
        <label for="symptoms">Symptoms</label>
        <input
          type="text"
          id="symptoms"
          name="symptoms"
          placeholder="e.g. headache, fatigue, nausea (comma-separated)"
          required
        />
        <small>Separate multiple symptoms with commas.</small>
      </div>

      <button type="submit">Get Prediction</button>
    </form>

    <section id="result" class="result hidden"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
